# Generated by neckbeard — do not edit. Regeneration refuses modified files;
# change neckbeard.yaml or app-profile.yaml and re-run plan + scaffold.
# The test hook (.neckbeard/hooks/test.sh) is yours and never regenerated.

name: neckbeard-infra

on:
  pull_request:
    paths: ["infra/**", ".neckbeard/catalog/**", ".checkov.yaml", ".neckbeard/release/**", "releases/*.tfvars.json"]
  push:
    branches: [main]
    paths: ["infra/**", ".neckbeard/catalog/**", ".checkov.yaml", ".neckbeard/release/**", "releases/*.tfvars.json"]

permissions:
  contents: read

jobs:
  policy:
    # The policy gate (DESIGN §10.1): checkov over every env root, honoring
    # the generated .checkov.yaml (every skip carries a written reason).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install checkov
        run: pipx install checkov==3.3.10 # pinned: the .checkov.yaml skips are curated against this version
      - name: Policy gate
        run: |
          checkov -d infra/envs/dev --quiet --compact --framework terraform --config-file .checkov.yaml
          checkov -d infra/bootstrap/dev --quiet --compact --framework terraform --config-file .checkov.yaml
          checkov -d infra/envs/stg --quiet --compact --framework terraform --config-file .checkov.yaml
          checkov -d infra/bootstrap/stg --quiet --compact --framework terraform --config-file .checkov.yaml
          checkov -d infra/envs/prd --quiet --compact --framework terraform --config-file .checkov.yaml
          checkov -d infra/bootstrap/prd --quiet --compact --framework terraform --config-file .checkov.yaml

  infra-dev:
    needs: [policy]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'dev-plan' || 'dev' }}
    concurrency:
      group: neckbeard-dev
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6 # pinned by the blueprint
          tofu_wrapper: false
      - name: Static validate (V0)
        run: |
          tofu -chdir=infra/envs/dev init -backend=false -input=false
          tofu -chdir=infra/envs/dev validate
      - name: Federate to AWS (dev) — plan role on PRs, apply role on pushes
        if: vars.NECKBEARD_AWS_PLAN_ROLE_DEV != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event_name == 'push' && vars.NECKBEARD_AWS_APPLY_ROLE_DEV || vars.NECKBEARD_AWS_PLAN_ROLE_DEV }}
          aws-region: us-east-1
      - name: Plan, and apply on main (V1; needs bootstrap, see docs/bootstrap.md)
        run: |
          if [ ! -f infra/envs/dev/backend.hcl ] || [ -z "${{ vars.NECKBEARD_AWS_PLAN_ROLE_DEV }}" ]; then
            echo "::warning::bootstrap pending for dev (backend.hcl or CI variables missing) — validate-only run; plan/apply NOT EXERCISED"
            exit 0
          fi
          tofu -chdir=infra/envs/dev init -reconfigure -input=false -backend-config=backend.hcl
          plan_flags=(); if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then plan_flags=(-read-only); fi
          cd .neckbeard/release
          GOWORK=off go run . infra-plan -root ../.. -env dev "${plan_flags[@]}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            GOWORK=off go run . infra-apply -root ../.. -env dev
          fi

  infra-stg:
    needs: [policy]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'stg-plan' || 'stg' }}
    concurrency:
      group: neckbeard-stg
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6 # pinned by the blueprint
          tofu_wrapper: false
      - name: Static validate (V0)
        run: |
          tofu -chdir=infra/envs/stg init -backend=false -input=false
          tofu -chdir=infra/envs/stg validate
      - name: Federate to AWS (stg) — plan role on PRs, apply role on pushes
        if: vars.NECKBEARD_AWS_PLAN_ROLE_STG != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event_name == 'push' && vars.NECKBEARD_AWS_APPLY_ROLE_STG || vars.NECKBEARD_AWS_PLAN_ROLE_STG }}
          aws-region: us-east-1
      - name: Plan, and apply on main (V1; needs bootstrap, see docs/bootstrap.md)
        run: |
          if [ ! -f infra/envs/stg/backend.hcl ] || [ -z "${{ vars.NECKBEARD_AWS_PLAN_ROLE_STG }}" ]; then
            echo "::warning::bootstrap pending for stg (backend.hcl or CI variables missing) — validate-only run; plan/apply NOT EXERCISED"
            exit 0
          fi
          tofu -chdir=infra/envs/stg init -reconfigure -input=false -backend-config=backend.hcl
          plan_flags=(); if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then plan_flags=(-read-only); fi
          cd .neckbeard/release
          GOWORK=off go run . infra-plan -root ../.. -env stg "${plan_flags[@]}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            GOWORK=off go run . infra-apply -root ../.. -env stg
          fi

  infra-prd:
    needs: [policy]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'prd-plan' || 'prd' }}
    concurrency:
      group: neckbeard-prd
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6 # pinned by the blueprint
          tofu_wrapper: false
      - name: Static validate (V0)
        run: |
          tofu -chdir=infra/envs/prd init -backend=false -input=false
          tofu -chdir=infra/envs/prd validate
      - name: Federate to AWS (prd) — plan role on PRs, apply role on pushes
        if: vars.NECKBEARD_AWS_PLAN_ROLE_PRD != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event_name == 'push' && vars.NECKBEARD_AWS_APPLY_ROLE_PRD || vars.NECKBEARD_AWS_PLAN_ROLE_PRD }}
          aws-region: us-east-1
      - name: Plan, and apply on main (V1; needs bootstrap, see docs/bootstrap.md)
        run: |
          if [ ! -f infra/envs/prd/backend.hcl ] || [ -z "${{ vars.NECKBEARD_AWS_PLAN_ROLE_PRD }}" ]; then
            echo "::warning::bootstrap pending for prd (backend.hcl or CI variables missing) — validate-only run; plan/apply NOT EXERCISED"
            exit 0
          fi
          tofu -chdir=infra/envs/prd init -reconfigure -input=false -backend-config=backend.hcl
          plan_flags=(); if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then plan_flags=(-read-only); fi
          cd .neckbeard/release
          GOWORK=off go run . infra-plan -root ../.. -env prd "${plan_flags[@]}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            GOWORK=off go run . infra-apply -root ../.. -env prd
          fi

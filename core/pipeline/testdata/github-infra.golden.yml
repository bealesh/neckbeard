name: neckbeard-infra

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  infra-dev:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6 # pinned by the blueprint
      - name: Static validate (V0)
        run: |
          tofu -chdir=infra/envs/dev init -backend=false -input=false
          tofu -chdir=infra/envs/dev validate
      - name: Federate to AWS (dev) — plan role on PRs, apply role on main
        if: vars.NECKBEARD_AWS_PLAN_ROLE_DEV != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event_name == 'push' && vars.NECKBEARD_AWS_APPLY_ROLE_DEV || vars.NECKBEARD_AWS_PLAN_ROLE_DEV }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan, and apply on main (V1; needs bootstrap backend config)
        run: |
          if [ ! -f infra/envs/dev/backend.hcl ] || [ -z "${{ vars.NECKBEARD_AWS_PLAN_ROLE_DEV }}" ]; then
            echo "::warning::bootstrap pending for dev (backend.hcl or CI roles missing) — validate-only run; plan/apply NOT EXERCISED"
            exit 0
          fi
          tofu -chdir=infra/envs/dev init -reconfigure -input=false -backend-config=backend.hcl
          tofu -chdir=infra/envs/dev plan -input=false -out=tfplan
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tofu -chdir=infra/envs/dev apply -input=false tfplan
          fi


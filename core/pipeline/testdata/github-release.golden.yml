name: neckbeard-release
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment with a reviewed release record
        type: choice
        required: true
        options: [dev, stg, prd]
permissions:
  contents: read
jobs:
  release-dev:
    if: github.ref == 'refs/heads/main' && inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: neckbeard-dev
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Federate to AWS (dev) — plan role on PRs, apply role on pushes
        if: success()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.NECKBEARD_AWS_APPLY_ROLE_DEV }}
          aws-region: us-east-1
      - name: Deploy and verify the committed digest
        run: |
          tofu -chdir=infra/envs/dev init -input=false -backend-config=backend.hcl
          cd .neckbeard/release
          GOWORK=off go run . restore-receipts -root ../.. -env dev
          GOWORK=off go run . stage -root ../.. -env dev
          GOWORK=off go run . deploy -root ../.. -env dev
          GOWORK=off go run . save-receipts -root ../.. -env dev
      - name: Retain verified release and rollback receipt
        uses: actions/upload-artifact@v4
        with:
          name: deployment-dev
          include-hidden-files: true
          retention-days: 90
          path: |
            .neckbeard/deploy/dev.receipt.json
            .neckbeard/deploy/dev.previous.json

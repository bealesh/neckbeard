# Generated by neckbeard — do not edit. Regeneration refuses modified files;
# change neckbeard.yaml or app-profile.yaml and re-run plan + scaffold.
# The test hook (.neckbeard/hooks/test.sh) is yours and never regenerated.

stages: [test, build, infra, release]

variables:
  AWS_REGION: us-east-1

.on_mr_or_default: &on_mr_or_default
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.oidc: &oidc
  id_tokens:
    NECKBEARD_OIDC_TOKEN:
      aud: https://gitlab.com

test:
  stage: test
  image: ubuntu:24.04
  <<: *on_mr_or_default
  script:
    - ./.neckbeard/hooks/test.sh

policy:
  # The policy gate (DESIGN §10.1): checkov over every env root, honoring the
  # generated .checkov.yaml (skips are curated against this pinned version).
  stage: test
  image:
    name: bridgecrew/checkov:3.3.10
    entrypoint: [""]
  rules:
    - if: $NECKBEARD_RELEASE_ENV
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["infra/**/*", ".neckbeard/catalog/**/*", ".checkov.yaml", ".neckbeard/release/**", "releases/*.tfvars.json"]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: ["infra/**/*", ".neckbeard/catalog/**/*", ".checkov.yaml", ".neckbeard/release/**", "releases/*.tfvars.json"]
  script:
    - checkov -d infra/envs/dev --quiet --compact --framework terraform --config-file .checkov.yaml
    - checkov -d infra/bootstrap/dev --quiet --compact --framework terraform --config-file .checkov.yaml
    - checkov -d infra/envs/stg --quiet --compact --framework terraform --config-file .checkov.yaml
    - checkov -d infra/bootstrap/stg --quiet --compact --framework terraform --config-file .checkov.yaml
    - checkov -d infra/envs/prd --quiet --compact --framework terraform --config-file .checkov.yaml
    - checkov -d infra/bootstrap/prd --quiet --compact --framework terraform --config-file .checkov.yaml

build:
  # Build once on the default branch; every environment runs this image by digest.
  stage: build
  image: docker:27
  services: ["docker:27-dind"]
  <<: *oidc
  environment:
    name: dev
    deployment_tier: development
  rules:
    - if: $NECKBEARD_RELEASE_ENV
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    REGISTRY: $NECKBEARD_REGISTRY_DEV
  script:
    - docker build --platform linux/amd64 --provenance=false -f 'bellwether/Dockerfile' -t "neckbeard-build:$CI_COMMIT_SHA" .
    # Scan gate: HIGH/CRITICAL block (DESIGN §10.1)
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL --exit-code 1 "neckbeard-build:$CI_COMMIT_SHA"
    - |
      if [ -z "$REGISTRY" ]; then
        echo "NECKBEARD_REGISTRY_DEV is not set (bootstrap pending, see docs/bootstrap.md) — build ran, push skipped"
        exit 0
      fi
      apk add --no-cache curl jq >/dev/null
      umask 077
      apk add --no-cache aws-cli >/dev/null
      echo "$NECKBEARD_OIDC_TOKEN" > /tmp/oidc-token
      export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc-token AWS_ROLE_ARN="$NECKBEARD_AWS_APPLY_ROLE_DEV"
      aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${REGISTRY%%/*}"
      docker tag "neckbeard-build:$CI_COMMIT_SHA" "$REGISTRY:$CI_COMMIT_SHA"
      docker push "$REGISTRY:$CI_COMMIT_SHA"
      docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY:$CI_COMMIT_SHA" > built-image.txt
  artifacts:
    name: built-image-$CI_COMMIT_SHA
    paths: [built-image.txt]
    expire_in: 90 days

infra-dev:
  stage: infra
  image: golang:1.27.1-bookworm
  <<: *oidc
  resource_group: neckbeard-dev
  environment:
    name: dev
    deployment_tier: development
  rules:
    - if: $NECKBEARD_RELEASE_ENV
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["infra/**/*", ".neckbeard/catalog/**/*", ".checkov.yaml", ".neckbeard/release/**", "releases/*.tfvars.json"]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: ["infra/**/*", ".neckbeard/catalog/**/*", ".checkov.yaml", ".neckbeard/release/**", "releases/*.tfvars.json"]
  script:
    - bash .neckbeard/install-release-tools.sh
    - tofu -chdir=infra/envs/dev init -backend=false -input=false
    - tofu -chdir=infra/envs/dev validate
    - |
      if [ ! -f infra/envs/dev/backend.hcl ] || [ -z "$NECKBEARD_AWS_PLAN_ROLE_DEV" ]; then
        echo "bootstrap pending for dev (backend.hcl or CI variables missing, see docs/bootstrap.md) — validate-only run; plan/apply NOT EXERCISED"
        exit 0
      fi
      umask 077
      ROLE="$NECKBEARD_AWS_PLAN_ROLE_DEV"; if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then ROLE="$NECKBEARD_AWS_APPLY_ROLE_DEV"; fi
      echo "$NECKBEARD_OIDC_TOKEN" > /tmp/oidc-token
      export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc-token AWS_ROLE_ARN="$ROLE"
      tofu -chdir=infra/envs/dev init -reconfigure -input=false -backend-config=backend.hcl
      plan_flags=(); if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then plan_flags=(-read-only); fi
      cd .neckbeard/release
      GOWORK=off go run . infra-plan -root ../.. -env dev "${plan_flags[@]}"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        GOWORK=off go run . infra-apply -root ../.. -env dev
      fi


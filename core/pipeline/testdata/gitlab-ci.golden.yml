      tofu -chdir=infra/envs/dev init -input=false -backend-config=backend.hcl
      cd .neckbeard/release
      GOWORK=off go run . restore-receipts -root ../.. -env dev
      GOWORK=off go run . stage -root ../.. -env dev
      GOWORK=off go run . deploy -root ../.. -env dev
      GOWORK=off go run . save-receipts -root ../.. -env dev
  artifacts:
    name: deployment-dev
    expire_in: 90 days
    paths:
      - .neckbeard/deploy/dev.receipt.json
      - .neckbeard/deploy/dev.previous.json


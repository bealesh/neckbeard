release-dev:
  stage: release
  image: golang:1.27.1-bookworm
  needs: [test]
  <<: *oidc
  resource_group: neckbeard-dev
  environment:
    name: dev
    deployment_tier: development
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NECKBEARD_RELEASE_ENV == "dev"
      when: manual
  allow_failure: false
  script:
    - bash .neckbeard/install-release-tools.sh
    - |
      umask 077
      ROLE="$NECKBEARD_AWS_PLAN_ROLE_DEV"; if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then ROLE="$NECKBEARD_AWS_APPLY_ROLE_DEV"; fi
      echo "$NECKBEARD_OIDC_TOKEN" > /tmp/oidc-token

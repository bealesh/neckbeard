      changes: ["infra/**/*", ".neckbeard/catalog/**/*", ".checkov.yaml", ".neckbeard/release/**", "releases/*.tfvars.json"]
      when: manual # prd gate: deployment approvals on Premium/Ultimate; protected branch otherwise (§11.3)

infra-prd:
  stage: infra
  image: golang:1.27.1-bookworm
  <<: *oidc
  resource_group: neckbeard-prd
  environment:
    name: prd
    deployment_tier: production
  rules:
    - if: $NECKBEARD_RELEASE_ENV

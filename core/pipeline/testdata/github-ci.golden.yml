# Generated by neckbeard — do not edit. Regeneration refuses modified files;
# change neckbeard.yaml or app-profile.yaml and re-run plan + scaffold.
# The test hook (.neckbeard/hooks/test.sh) is yours and never regenerated.

name: neckbeard-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test hook
        run: ./.neckbeard/hooks/test.sh

  build:
    # Build once on main; every environment runs this image by digest.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # OIDC federation — no static cloud keys (DESIGN §10.1)
    env:
      REGISTRY: ${{ vars.NECKBEARD_REGISTRY_DEV }}
    steps:
      - uses: actions/checkout@v4
      - name: Check bootstrap
        id: bootstrap
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "::warning::NECKBEARD_REGISTRY_DEV is not set (bootstrap pending) — build runs, push is skipped"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Federate to AWS (dev)
        if: steps.bootstrap.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.NECKBEARD_AWS_APPLY_ROLE_DEV }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build image
        run: docker build -f bellwether/Dockerfile -t "neckbeard-build:${GITHUB_SHA}" .
      - name: Scan image (HIGH/CRITICAL block the merge gate)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --severity HIGH,CRITICAL --exit-code 1 "neckbeard-build:${GITHUB_SHA}"
      - name: Push (immutable tag; promotion moves digests, never rebuilds)
        if: steps.bootstrap.outputs.push == 'true'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${REGISTRY%%/*}"
          docker tag "neckbeard-build:${GITHUB_SHA}" "${REGISTRY}:${GITHUB_SHA}"
          docker push "${REGISTRY}:${GITHUB_SHA}"
          echo "Pushed digest:"
          docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY}:${GITHUB_SHA}"

name: test

on:
  pull_request:
  push:
    branches: [main]

# The permanent invariant (CONTRIBUTING.md): pull requests never touch a cloud
# account. This repository holds no cloud secrets and no OIDC provider anywhere
# trusts it; every job below runs credential-free with read-only permissions.
# Live deployment tests run from dedicated private fixture repositories via the
# release harness, dispatched by a maintainer — never from a pull request.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Mechanical enforcement of the invariant above: a PR that tries to give CI
  # credentials (or the write-token event fork PRs inherit secrets from) fails
  # here before a human has to catch it in review.
  fork-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PR-triggered workflows must stay credential-free
        # Bracket classes keep these patterns from matching their own source.
        run: |
          set -eu
          fail=0
          if grep -RnE 'pull_request[_]target' .github/workflows/; then
            echo '::error::the pull_request write-token event is banned in this repository'
            fail=1
          fi
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            if grep -qE '^[[:space:]]*pull_request[[:space:]]*:' "$f"; then
              if grep -nE 'id[-]token|secrets[.]' "$f"; then
                echo "::error file=$f::a workflow with a pull_request trigger must not request OIDC tokens or reference secrets"
                fail=1
              fi
            fi
          done
          exit "$fail"

  # The plugin files are the product's front door; keep them well-formed and
  # keep the bootstrap script working from a machine that has only Go.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Manifests, hook, and commands are well-formed
        run: |
          set -eu
          jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json >/dev/null
          test "$(jq -r '.plugins[0].source' .claude-plugin/marketplace.json)" = "./"
          test "$(jq -r .version .claude-plugin/plugin.json)" != "null"
          for f in commands/*.md; do
            head -n1 "$f" | grep -qx -- '---' || { echo "::error file=$f::command needs frontmatter"; exit 1; }
            grep -q '^description:' "$f" || { echo "::error file=$f::command frontmatter needs a description"; exit 1; }
          done
          grep -q '^name: neckbeard$' skills/neckbeard/SKILL.md
          bash -n hooks/session-start.sh scripts/install.sh
          CLAUDE_PLUGIN_ROOT="$PWD" bash hooks/session-start.sh \
            | jq -e '.hookSpecificOutput.hookEventName == "SessionStart" and (.hookSpecificOutput.additionalContext | test("neckbeard"))' >/dev/null
      - name: Installer bootstraps the CLI (release binary when one exists, else go install)
        run: |
          set -eu
          # Candidate manifest versions may not be published yet; version selection
          # is covered offline by the Go installer tests. Smoke-test stable assets.
          bash scripts/install.sh -v latest -d "$RUNNER_TEMP/nbbin"
          "$RUNNER_TEMP/nbbin/neckbeard" version
          PATH="$RUNNER_TEMP/nbbin:$PATH" bash scripts/install.sh -v latest | grep -q 'already installed'

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
      - name: catalog modules are fmt-clean
        run: tofu fmt -check -recursive catalog/

  # V0 the supported lanes end-to-end: plan → scaffold → fmt/init/validate + checkov,
  # per env, against the real providers (no cloud credentials involved).
  lanes:
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
        runtime: [serverless-containers]
        include:
          - { cloud: aws, runtime: kubernetes }
          - { cloud: gcp, runtime: kubernetes }
          - { cloud: azure, runtime: kubernetes }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Install checkov
        run: pipx install checkov==3.3.10 # pinned: skip lists are curated against this version; bumps are deliberate
      - name: Install actionlint
        # Exercises the validator's workflow lint path in CI, including the
        # surgical `queue: max` exclusion for this exact version (issues/680).
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build neckbeard
        run: go build -o bin/neckbeard ./cmd/neckbeard
      - name: Install kubeconform
        if: matrix.runtime == 'kubernetes'
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 # pinned; bumps are deliberate
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Plan, scaffold, validate (${{ matrix.cloud }}/${{ matrix.runtime }})
        run: |
          set -eu
          LANE=$(mktemp -d)
          cp bellwether/app-profile.yaml "$LANE/"
          case "${{ matrix.cloud }}" in
            aws)
              cp bellwether/neckbeard.yaml "$LANE/" ;;
            gcp)
              sed -e 's/^cloud: aws/cloud: gcp/' -e 's/^region: us-east-1/region: us-central1/' \
                  -e 's/^  monthly_budget_alert: 100$/  monthly_budget_alert: 100\n  billing_account: "012345-6789AB-CDEF01"/' \
                bellwether/neckbeard.yaml > "$LANE/neckbeard.yaml"
              printf 'containers:\n  dev: ci-dev\n  stg: ci-stg\n  prd: ci-prd\n' >> "$LANE/neckbeard.yaml" ;;
            azure)
              # gitlab VCS here so both pipeline renderers stay exercised in CI
              sed -e 's/^cloud: aws/cloud: azure/' -e 's/^region: us-east-1/region: eastus2/' \
                  -e 's/^vcs: github/vcs: gitlab/' \
                bellwether/neckbeard.yaml > "$LANE/neckbeard.yaml"
              printf 'containers:\n  dev: 00000000-0000-0000-0000-000000000001\n  stg: 00000000-0000-0000-0000-000000000002\n  prd: 00000000-0000-0000-0000-000000000003\n' >> "$LANE/neckbeard.yaml" ;;
          esac
          if [ "${{ matrix.runtime }}" = "kubernetes" ]; then
            sed -i 's/^runtime: serverless-containers/runtime: kubernetes/' "$LANE/neckbeard.yaml"
          fi
          bin/neckbeard plan -config "$LANE/neckbeard.yaml" -profile "$LANE/app-profile.yaml" \
            -out "$LANE/blueprint.yaml"
          cd "$LANE"
          "$GITHUB_WORKSPACE/bin/neckbeard" scaffold
          "$GITHUB_WORKSPACE/bin/neckbeard" validate

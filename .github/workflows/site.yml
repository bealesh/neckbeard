name: site

# Deploys site/ to Cloudflare Workers (static assets) as neckbeard.sh.
#
# The fork-safety invariant (CONTRIBUTING.md) holds here: no pull_request
# trigger, so a PR can never reach the Cloudflare token. Only pushes to main
# that touch site/ deploy, and the token is scoped to Workers on one account
# (Workers Scripts: Edit, Workers Routes: Edit, plus Zone: Read for the
# custom domain), not to anything cloud-shaped.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: neckbeard.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Site files are well-formed
        run: |
          set -eu
          test -f site/public/index.html
          test -f site/public/404.html
          test -f site/public/style.css
          # every local asset the pages reference exists
          grep -oE '(href|src)="/[^"#]+' site/public/*.html | sed -E 's/.*="//' | sort -u | while read -r p; do
            test -f "site/public${p}" || { echo "::error::$p is referenced but missing from site/public"; exit 1; }
          done
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
